spring:
  profiles:
    default: local
  mvc:
    format:
      date: iso
  datasource:
    url: jdbc:postgresql://localhost:5432/sigpap
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 120MB
  task:
    scheduling:
      pool:
        size: 2
        # par défaut 1 : un passage long de BatchAnticipation retarderait le battement du flux

comptes:
  demandes-max-en-attente: 200   # [NOUVEAU] plafond de demandes en attente (protège l'inscription publique)

anticipation:
  # MC1E est un ancien nom de ST0E pour le grade suivant uniquement. Le type d'échéance
  # suit le grade enregistré : MC1E reste en AVANCEMENT. Ne pas l'ajouter à grades-stagiaire.
  grades-stagiaire: ST0E
  # Renommages applicables dans tous les corps.
  correspondance-grades:
    "MC1E": "ST0E"
    "MC2E": "2C1E"
    "MC3E": "2C2E"
    "EX0E": "EX1E"
  # Ces exceptions s'appliquent à toutes les catégories de ces corps seulement.
  correspondance-grades-par-corps:
    "A88L":
      "1C4E": "PR1E"
    "J88L":
      "1C4E": "PR1E"
    "U88L":
      "1C4E": "PR1E"

dossiers:
  date-reprise: "2026-01-01"
  # roles-exemptes-conflit: ROLE_ADMIN   # [NOUVEAU] décommentez pour dispenser un rôle de la règle du dossier propre

server:
  port: 8080
  address: 0.0.0.0
  error:                   # <--- IL MANQUAIT CETTE LIGNE
    include-message: always
    include-binding-errors: always

app:
  jwt:
    # Clé Base64 de 256 bits minimum pour HS256
    secret: "4D6251655468576D5A7134743777217A25432A462D4A614E645267556B586E32"
    expiration: 86400000   # 24 h en millisecondes

logging:
  level:
    com.entreprise.gestion: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.web: DEBUG
    org.springframework.data.jpa: DEBUG
