spring:
  mvc:
    format:
      date: iso
  # PostgreSQL (était : H2 en mémoire). À adapter : nom de la base, utilisateur, mot de passe.
  datasource:
    url: jdbc:postgresql://localhost:5432/sigpap
    username: postgres
    password: romario316
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # « update » crée les tables et ajoute les colonnes manquantes, sans rien supprimer.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # crée aussi les trois schémas (anticipation, referentiel_rh, gestion_utilisateurs) s'ils n'existent pas.
        hbm2ddl:
          create_namespaces: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 120MB
  task:
    scheduling:
      pool:
        size: 2            # par défaut 1 : un passage long de BatchAnticipation retarderait le battement du flux

comptes:
  demandes-max-en-attente: 200   # plafond de demandes en attente (protège l'inscription publique)

anticipation:
  # MC1E est un ancien nom de ST0E pour le grade suivant uniquement. Le type d'échéance
  # suit le grade enregistré : MC1E reste en AVANCEMENT. Ne pas l'ajouter à grades-stagiaire.
  batch:
    cron: "0 0 */2 * * *"
  grades-stagiaire: ST0E
  # Renommages applicables dans tous les corps.
  correspondance-grades:
    "MC1E": "ST0E"
    "MC2E": "2C1E"
    "MC3E": "2C2E"
    "EX0E": "EX1E"
  # Ces exceptions s'appliquent à toutes les catégories de ces corps seulement.
  correspondance-grades-par-corps:
    "A88L":
      "1C4E": "PR1E"
    "J88L":
      "1C4E": "PR1E"
    "U88L":
      "1C4E": "PR1E"

dossiers:
  date-reprise: "2026-01-01"
  # roles-exemptes-conflit: ROLE_ADMIN   # décommentez pour dispenser un rôle de la règle du dossier propre

server:
  port: 8080
  address: 0.0.0.0
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    # Clé Base64 de 256 bits minimum pour HS256. À remplacer avant tout déploiement réel.
    secret: "4D6251655468576D5A7134743777217A25432A462D4A614E645267556B586E32"
    expiration: 86400000   # 24 h en millisecondes

logging:
  level:
    com.entreprise.gestion: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.web: DEBUG
    org.springframework.data.jpa: DEBUG
